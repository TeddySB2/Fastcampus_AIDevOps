# PR 마다 product-catalog 를 테스트 → 이미지 빌드(push 안 함) → Trivy 스캔 → SBOM 순서로 검사한다.
# 클라우드 자격 증명을 받지 않고, 클러스터에 배포하지 않는다 (.github/CLAUDE.md).
name: CI

on:
  pull_request:
    paths:
      - app/product-catalog/**
      - .github/workflows/ci.yaml
      - .trivyignore

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  APP_DIR: app/product-catalog
  IMAGE: product-catalog:${{ github.event.pull_request.head.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.APP_DIR }}/go.mod
          cache-dependency-path: ${{ env.APP_DIR }}/go.sum

      - name: go vet
        working-directory: ${{ env.APP_DIR }}
        run: go vet ./...

      - name: go test
        working-directory: ${{ env.APP_DIR }}
        run: go test ./...

  build-scan-sbom:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.APP_DIR }}
          push: false
          load: true
          tags: ${{ env.IMAGE }}

      - name: Trivy scan (CRITICAL/HIGH, fixed only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      # 스캔이 실패해도 빌드된 이미지의 SBOM 은 남겨 원인 분석에 쓴다.
      - name: SBOM (SPDX JSON)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          format: spdx-json
          output: sbom.spdx.json
          exit-code: "0"
          skip-setup-trivy: true

      - name: Upload SBOM
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-product-catalog-${{ github.event.pull_request.head.sha }}
          path: sbom.spdx.json
          if-no-files-found: error
