# product-catalog 빌드 → 테스트 → 취약점 스캔 → (main 만) ECR push → gitops PR
#
# - PR: 빌드·테스트·스캔만. AWS 자격 증명을 쓰지 않는다.
# - main push: OIDC 로 ECR 에 push 하고, dev values 의 이미지를 digest 로 바꾸는 PR 을 만든다.
#   클러스터에는 직접 배포하지 않는다. 배포는 Argo CD 가 Git 을 보고 한다.
#
# 저장소 설정
#   Variables: AWS_REGION, AWS_CI_ROLE_ARN, ECR_REPOSITORY_URL
# 액션 버전은 commit SHA 로 고정한다 (태그는 바뀔 수 있다).
name: CI

on:
  pull_request:
    paths:
      - "app/product-catalog/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "app/product-catalog/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_DIR: app/product-catalog
  LOCAL_IMAGE: product-catalog:${{ github.sha }}

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.SERVICE_DIR }}/go.mod
          cache-dependency-path: ${{ env.SERVICE_DIR }}/go.sum

      - name: Unit test
        working-directory: ${{ env.SERVICE_DIR }}
        run: go test ./...

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVICE_DIR }}
          load: true
          tags: ${{ env.LOCAL_IMAGE }}

      - name: Vulnerability scan (CRITICAL/HIGH 는 실패)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.LOCAL_IMAGE }}
          format: spdx-json
          artifact-name: product-catalog-sbom.spdx.json

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test-scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # OIDC
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push (tag = git sha, 불변)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVICE_DIR }}
          push: true
          tags: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}

      - name: Update dev values (digest 고정)
        env:
          REPO: ${{ vars.ECR_REPOSITORY_URL }}
          TAG: ${{ github.sha }}@${{ steps.push.outputs.digest }}
        run: |
          yq -i '.components."product-catalog".imageOverride.repository = strenv(REPO)' gitops/values/otel-demo/dev.yaml
          yq -i '.components."product-catalog".imageOverride.tag = strenv(TAG)' gitops/values/otel-demo/dev.yaml
          git diff

      - name: Open gitops PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: deploy/dev-product-catalog-${{ github.sha }}
          commit-message: "deploy(dev): product-catalog ${{ github.sha }}"
          title: "deploy(dev): product-catalog ${{ github.sha }}"
          body: |
            CI 가 만든 dev 배포 PR 입니다.

            - 이미지: `${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}`
            - digest: `${{ steps.push.outputs.digest }}`
            - 스캔: CRITICAL/HIGH (수정 가능) 0건
            - 확인 항목: merge 후 Argo CD `otel-demo-dev` Healthy, `tests/smoke.sh` 통과
          labels: deploy-dev
