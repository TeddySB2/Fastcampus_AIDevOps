# 6-2: dev 에서 검증한 product-catalog 이미지를 prod values 로 승격하는 PR 을 만든다.
#
# - "prod" Environment 에 승인자를 지정해 두면, 이 job 은 승인 전까지 대기한다.
# - PR 이 merge 되어도 Argo CD 의 otel-demo-prod 는 자동 동기화하지 않는다.
#   사람이 Argo CD 에서 Diff 를 확인하고 Sync 한다.
name: Promote to prod

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "승격 사유 (PR 본문에 기록)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v6

      - name: Copy image from dev to prod
        id: copy
        run: |
          repo=$(yq '.components."product-catalog".imageOverride.repository' gitops/values/otel-demo/dev.yaml)
          tag=$(yq '.components."product-catalog".imageOverride.tag' gitops/values/otel-demo/dev.yaml)
          if [ "$repo" = "null" ] || [ "$tag" = "null" ]; then
            echo "dev 에 product-catalog imageOverride 가 없습니다. CI 배포 PR 을 먼저 merge 하세요." >&2
            exit 1
          fi
          REPO="$repo" TAG="$tag" yq -i '.components."product-catalog".imageOverride.repository = strenv(REPO) | .components."product-catalog".imageOverride.tag = strenv(TAG)' gitops/values/otel-demo/prod.yaml
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git diff

      - name: Open promotion PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: promote/prod-product-catalog-${{ github.run_id }}
          commit-message: "promote(prod): product-catalog ${{ steps.copy.outputs.tag }}"
          title: "promote(prod): product-catalog"
          body: |
            dev 에서 검증된 이미지를 prod 로 승격합니다.

            - 이미지 태그: `${{ steps.copy.outputs.tag }}`
            - 사유: ${{ inputs.reason }}
            - 요청자: @${{ github.actor }}

            merge 후 확인 순서
            1. Argo CD `otel-demo-prod` 의 Diff 가 product-catalog 이미지 한 줄인지 확인
            2. Sync
            3. `NS=otel-demo-prod` 로 port-forward 후 `tests/smoke.sh`
          labels: promote-prod
