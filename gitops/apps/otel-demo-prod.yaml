# prod: 자동 동기화하지 않는다. 승격 PR 이 merge 된 뒤 사람이 직접 Sync 한다 (6-2).
# 학습 비용을 위해 같은 클러스터의 별도 네임스페이스를 prod 로 사용한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-demo-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: otel-demo
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-demo
      targetRevision: 0.42.1
      helm:
        releaseName: otel-demo-prod
        valueFiles:
          - $values/gitops/values/otel-demo/common.yaml
          - $values/gitops/values/otel-demo/prod.yaml
    - repoURL: https://github.com/REPLACE_ME_OWNER/ai-devops-lab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/REPLACE_ME_OWNER/ai-devops-lab.git
      targetRevision: main
      path: gitops/manifests/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: otel-demo-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
