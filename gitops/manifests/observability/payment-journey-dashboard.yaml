# 결제 여정 대시보드 (specs/observability.md 7장 A · 9장 SLI 를 한 화면에).
# Grafana sidecar 가 label grafana_dashboard=1 인 ConfigMap 을 읽어 provisioning 한다 (UI 수정은 저장되지 않는다).
# JSON 은 scratch 생성 스크립트 없이 직접 고쳐도 된다. 쿼리의 메트릭 이름 · 라벨은 Demo 내장 Prometheus 에서 확인한 실제 값이다
# (traces_span_metrics_calls_total{service_name, span_name, span_kind, status_code}, duration 버킷 le=1000 존재).
# namespace 는 적지 않는다. Application(kube-prometheus-stack) 의 destination 을 따른다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-payment-journey
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: observability
