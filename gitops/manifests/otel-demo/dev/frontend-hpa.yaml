# frontend HPA (dev).
# 차트 0.42.1 은 HPA 를 만들지 않으므로 이 디렉터리에서 직접 둔다 (otel-demo-dev Application 의 세 번째 source).
# - CPU 사용률은 requests 기준이다. requests 는 common.yaml 의 components.frontend.resources 에 있다.
# - 차트가 Deployment 에 replicas 를 렌더링하므로, Application 의 ignoreDifferences 로 /spec/replicas 를 HPA 에 맡긴다.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: otel-demo-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
