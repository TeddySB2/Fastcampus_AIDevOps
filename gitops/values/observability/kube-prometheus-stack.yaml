# kube-prometheus-stack (차트 92.10.0) — dev 실습 환경 값.
# 키는 추측하지 말고 차트의 values.yaml 에서 확인한다:
#   helm show values prometheus-community/kube-prometheus-stack --version 92.10.0
#
# 실습 환경 제약 (스펙 specs/observability.md "4. 제약"):
# - EBS CSI 가 없어 PVC 를 만들지 않는다 → Pod 가 재시작되면 메트릭 · 알람 이력이 사라진다. 보존 기간을 짧게 둔다.
# - 접속은 port-forward. Ingress 를 만들지 않는다.
# - 운영이라면: PVC(gp3) 또는 원격 저장(Thanos · Mimir · AMP), retention 15d 이상, Grafana DB 는 RDS.

# 리소스 이름을 짧게: kps-prometheus, kps-alertmanager, kps-operator ... (Grafana 는 kps-grafana)
fullnameOverride: kps

# 기본 알람 룰은 켜 두되, EKS 에서 수집할 수 없는 대상의 룰은 끈다 (4-2 Alert Noise 정리).
# 근거: 지난 24시간 ALERTS 이력에서 아래 대상의 *Down · TargetDown 알람이 계속 발화했다. 조치할 수 있는 사람이 없다.
defaultRules:
  create: true
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false

# EKS 는 컨트롤 플레인(etcd · controller-manager · scheduler)을 AWS 가 운영한다. 수집 대상에서 뺀다.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
# EKS 의 kube-proxy 는 메트릭을 127.0.0.1:10249 에만 연다. 수집하려면 kube-proxy 설정을 바꿔야 해서 이번에는 뺀다.
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 2d
    retentionSize: 8GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 3Gi
    # OTel Demo 의 Collector 가 OTLP 로 메트릭을 보낸다 (POST /api/v1/otlp/v1/metrics)
    enableOTLPReceiver: true
    otlp:
      # OTLP 속성 → Prometheus 이름 규칙. 점은 밑줄, 단위 접미사(_seconds, _total)가 붙는다.
      # Demo 기본 대시보드와 같은 이름을 쓰기 위해 명시한다.
      translationStrategy: UnderscoreEscapingWithSuffixes
      keepIdentifyingResourceAttributes: true
      # 리소스 속성 중 라벨로 올릴 것 (Demo 차트의 Prometheus 설정과 같게)
      promoteResourceAttributes:
        - service.name
        - service.namespace
        - service.instance.id
        - service.version
        - deployment.environment.name
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.deployment.name
        - k8s.node.name
        - k8s.container.name
    # Collector 의 배치 전송 때문에 시각이 조금 늦게 도착하는 샘플을 받는다
    tsdb:
      outOfOrderTimeWindow: 30m
    # 메트릭 → 트레이스 이동 (exemplar)
    enableFeatures:
      - exemplar-storage
    # release 라벨이 없는 PrometheusRule · ServiceMonitor 도 읽는다 (gitops/manifests/observability 의 룰)
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

alertmanager:
  alertmanagerSpec:
    retention: 24h
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
    # Slack 웹훅 URL 은 Git 에 두지 않는다. 사람이 Secret 을 만든다 (4-1):
    #   kubectl -n observability create secret generic alertmanager-slack --from-literal=url='https://hooks.slack.com/services/...'
    # → /etc/alertmanager/secrets/alertmanager-slack/url 로 마운트된다
    secrets:
      - alertmanager-slack
  config:
    global:
      resolve_timeout: 5m
      slack_api_url_file: /etc/alertmanager/secrets/alertmanager-slack/url
    route:
      receiver: "null"
      group_by: [alertname, namespace, service_name]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Watchdog 는 "알람 파이프라인이 살아 있다" 는 신호다. 사람에게 보내지 않는다
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        # 알람 계약(specs/observability.md 6장): page · ticket 만 Slack 으로
        - receiver: slack-alerts
          matchers:
            - severity =~ "page|critical"
          repeat_interval: 1h
        - receiver: slack-alerts
          matchers:
            - severity = "ticket"
          repeat_interval: 12h
        # 차트 기본 룰의 warning 은 원인형 지표가 많다. 알람 이름별로 묶어 하루 한 번만 보낸다 (4-2)
        - receiver: slack-alerts
          matchers:
            - severity = "warning"
          group_by: [alertname]
          group_interval: 30m
          repeat_interval: 24h
        # info 와 InfoInhibitor 는 보내지 않는다 (대시보드 · 일일 점검에서 본다)
        - receiver: "null"
          matchers:
            - severity =~ "info|none"
    inhibit_rules:
      # 같은 서비스에서 page 가 울리면 ticket 은 보내지 않는다 (같은 원인의 하위 증상)
      - source_matchers:
          - severity = "page"
        target_matchers:
          - severity = "ticket"
        equal: [service_name]
      # 차트 기본 inhibit 규칙
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity =~ "warning|info"
        equal: [namespace, alertname]
      - source_matchers:
          - severity = "warning"
        target_matchers:
          - severity = "info"
        equal: [namespace, alertname]
      - source_matchers:
          - alertname = "InfoInhibitor"
        target_matchers:
          - severity = "info"
        equal: [namespace]
      - target_matchers:
          - alertname = "InfoInhibitor"
    receivers:
      - name: "null"
      - name: slack-alerts
        slack_configs:
          - channel: "#alerts"
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
            text: |-
              {{ range .Alerts }}• {{ .Annotations.summary }}
              {{ if .Annotations.runbook_url }}Runbook: {{ .Annotations.runbook_url }}{{ end }}
              {{ end }}
    templates:
      - /etc/alertmanager/config/*.tmpl

grafana:
  # admin 계정은 차트가 만들지 않는다. 사람이 Secret 을 먼저 만든다 (1-2):
  #   kubectl -n observability create secret generic grafana-admin \
  #     --from-literal=admin-user=admin --from-literal=admin-password="$(openssl rand -base64 18)"
  admin:
    existingSecret: grafana-admin
  # PV 가 없다 → UI 에서 만든 대시보드 · 서비스 계정은 Pod 재시작 때 사라진다.
  # 대시보드는 Git(ConfigMap)으로만 관리한다 (2-3). 서비스 계정 토큰은 재시작 후 다시 만든다 (2-1).
  persistence:
    enabled: false
  grafana.ini:
    auth.anonymous:
      enabled: false
    users:
      viewers_can_edit: false
    # 쿼리 감사: 누가(어느 서비스 계정이) 어떤 데이터소스를 조회했는지 서버 로그에 남긴다 (2-1)
    log:
      level: info
    dataproxy:
      logging: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  sidecar:
    dashboards:
      # ConfigMap 의 grafana_folder 어노테이션으로 폴더를 나눈다 (gitops/manifests/observability/dashboards)
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    datasources:
      # 기본 Prometheus 데이터소스: exemplar 의 trace_id 를 누르면 Tempo 로 이동
      exemplarTraceIdDestinations:
        datasourceUid: tempo
        traceIdLabelName: trace_id
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.observability.svc:3100
      jsonData:
        maxLines: 1000
        # 로그 줄의 trace_id(structured metadata) → Tempo 트레이스로 이동
        derivedFields:
          - name: trace_id
            matcherType: label
            matcherRegex: trace_id
            datasourceUid: tempo
            url: "$${__value.raw}"
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.observability.svc:3200
      jsonData:
        # 트레이스의 span → 같은 trace_id 의 Loki 로그
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
          filterByTraceId: true
          customQuery: true
          query: '{service_name="$${__span.tags["service.name"]}"} | trace_id="$${__trace.traceId}"'
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
