# dev 환경 값.
#
# product-catalog 이미지는 CI(.github/workflows/ci.yml)가 아래 블록을 추가·갱신하는 PR 을 만든다.
# CI 가 한 번도 돌지 않은 상태에서는 차트 기본(업스트림) 이미지를 쓴다.
# tag 형식: "<git sha>@sha256:<digest>"  → 차트가 "<repository>:<tag>" 로 조립한다.
#
# components:
#   product-catalog:
#     imageOverride:
#       repository: "<ACCOUNT>.dkr.ecr.ap-northeast-2.amazonaws.com/ai-devops-lab/product-catalog"
#       tag: "<sha>@sha256:<digest>"
components: {}
