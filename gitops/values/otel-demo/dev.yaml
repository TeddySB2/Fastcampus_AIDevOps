# dev 환경 값.
#
# product-catalog 이미지: 처음 ECR 에 push 한 뒤 아래 블록을 추가하는 PR 을 만든다(수동).
# 이후에는 CI(.github/workflows/ci.yml)가 이 블록을 갱신하는 PR 을 만든다.
# 블록이 없으면 차트 기본(업스트림) 이미지를 쓴다.
# tag 형식: "<git sha>@sha256:<digest>"  → 차트가 "<repository>:<tag>" 로 조립한다.
#
# components:
#   product-catalog:
#     imageOverride:
#       repository: "<ACCOUNT>.dkr.ecr.ap-northeast-2.amazonaws.com/ai-devops-lab/product-catalog"
#       tag: "<sha>@sha256:<digest>"
components:
  product-catalog:
    imageOverride:
      repository: "067620369479.dkr.ecr.ap-northeast-2.amazonaws.com/ai-devops-lab/product-catalog"
      tag: "c2d002d@sha256:bf7da8799db9921f2a5df2a7449debb2b1b2fff0ba721702ebc31d70f688f50b"

# 관측: Demo 에 들어 있는 백엔드(데모용)는 끄고, observability 네임스페이스의 스택으로 보낸다 (Part 4 1-2).
#   메트릭 → kube-prometheus-stack 의 Prometheus (OTLP 수신)
#   트레이스 → Tempo, 로그 → Loki (OTLP 네이티브)
# Collector 는 Demo 것을 그대로 쓴다. exporter 와 pipeline 만 바꾼다.
jaeger:
  enabled: false
prometheus:
  enabled: false
grafana:
  enabled: false
opensearch:
  enabled: false
opentelemetry-collector:
  config:
    exporters:
      # 차트 기본 exporter(otlp_grpc/jaeger, opensearch)는 남겨 둔다. 아래 pipelines 에서 빼면 쓰이지 않는다.
      # null 로 지우면 키는 남고 값만 비어서 Collector 가 "endpoint must be specified" 로 시작하지 못한다.
      otlp_http/prometheus:
        endpoint: http://kps-prometheus.observability.svc:9090/api/v1/otlp
        tls:
          insecure: true
        sending_queue:
          batch: {}
      otlp_grpc/tempo:
        endpoint: tempo.observability.svc:4317
        tls:
          insecure: true
        sending_queue:
          batch: {}
      otlp_http/loki:
        endpoint: http://loki.observability.svc:3100/otlp
        tls:
          insecure: true
        sending_queue:
          batch: {}
    connectors:
      # span metrics 에 trace_id exemplar 를 붙인다 → Grafana 에서 메트릭 점을 누르면 그 트레이스로 이동
      span_metrics:
        exemplars:
          enabled: true
    service:
      pipelines:
        traces:
          exporters: [otlp_grpc/tempo, debug, span_metrics]
        logs:
          exporters: [otlp_http/loki, debug]
