# prod 환경 값 (같은 클러스터의 otel-demo-prod 네임스페이스).
# - 관측 스택(collector, jaeger, prometheus, grafana, opensearch)은 dev 에만 둔다.
#   같은 클러스터에 두 벌을 올리면 ClusterRole 이름이 충돌하고 비용이 두 배가 된다.
# - collector 가 없어서 각 서비스의 텔레메트리 전송은 실패 로그만 남긴다.
#   OTEL_SDK_DISABLED 는 쓰지 않는다. email(Ruby)이 SDK 가 꺼진 상태에서 시작하지 못하고 CrashLoop 한다.
# - product-catalog 이미지는 승격 워크플로(.github/workflows/promote.yml)가 dev 값을 복사한다.
opentelemetry-collector:
  enabled: false
jaeger:
  enabled: false
prometheus:
  enabled: false
grafana:
  enabled: false
opensearch:
  enabled: false
components:
  load-generator:
    enabled: false
  product-catalog:
    imageOverride:
      repository: 067620369479.dkr.ecr.ap-northeast-2.amazonaws.com/ai-devops-lab/product-catalog
      tag: c2d002d@sha256:bf7da8799db9921f2a5df2a7449debb2b1b2fff0ba721702ebc31d70f688f50b
