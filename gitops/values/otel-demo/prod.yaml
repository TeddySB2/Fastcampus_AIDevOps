# prod 환경 값 (같은 클러스터의 otel-demo-prod 네임스페이스).
# - 관측 스택(collector, jaeger, prometheus, grafana, opensearch)은 dev 에만 둔다.
#   같은 클러스터에 두 벌을 올리면 ClusterRole 이름이 충돌하고 비용이 두 배가 된다.
# - SDK 의 텔레메트리 전송을 끈다.
# - product-catalog 이미지는 승격 워크플로(.github/workflows/promote.yml)가 dev 값을 복사한다.
default:
  envOverrides:
    - name: OTEL_SDK_DISABLED
      value: "true"

opentelemetry-collector:
  enabled: false
jaeger:
  enabled: false
prometheus:
  enabled: false
grafana:
  enabled: false
opensearch:
  enabled: false

components:
  load-generator:
    enabled: false
  # product-catalog:
  #   imageOverride:   ← 승격 워크플로가 dev 의 값을 그대로 복사한다
