# dev 환경은 port-forward 로 접속하므로 외부 노출을 하지 않는다.
configs:
  params:
    server.insecure: true
  cm:
    # Claude Code 의 Argo CD MCP 가 쓰는 읽기 전용 계정 (API 토큰만, 로그인 불가)
    accounts.mcp-readonly: apiKey
    exec.enabled: false
  rbac:
    policy.default: ""
    policy.csv: |
      g, mcp-readonly, role:readonly

server:
  service:
    type: ClusterIP

dex:
  enabled: false

notifications:
  enabled: false
