# OrderFailureRateHigh(SLO burn-rate 3단계) 단위 테스트 — 가짜 메트릭으로 "언제 울리고 언제 안 울리는지" 를 고정한다.
# 실행: ./tests/alerts/run.sh  (클러스터 없이 promtool 로 돈다)
# 시나리오는 사람이 정하고(리뷰 포인트), 숫자 계산 · 파일 작성 · 실행은 Claude 가 한다.
# 표기: '0+4x30' = 0 에서 시작해 1분마다 4 씩 30번 증가(카운터), '0x5' = 0 이 5번 더 반복
#
# ① ~ ③ 은 장애 앞에 정상 주문 1일(1440분)을 깔아 둔다. burn-rate 는 긴 창(최대 1d)의 실패율을 보므로
# 이력이 없으면 실제보다 훨씬 빨리 울린다(④ 가 그 경우). 그래서 eval_time 은 모두 "24h + 장애 뒤 경과 시간" 이다.
# 장애 중에도 전체 주문량은 그대로 두고(분당 4건 또는 100건) 그 일부가 실패로 바뀐다.
rule_files: [order-failure-alert.rules.yaml]
evaluation_interval: 30s

tests:
  # ① 결제 실패 50% 가 계속된다 → 울려야 한다 (burn 50배)
  #    분당 성공 2 · 실패 2. 1h 실패율이 14.4% 를 넘는 것은 장애 18분째(2×18/240 = 15%), for: 2m 뒤 20분에 14.4배 단계 firing
  #    6h 실패율이 6% 를 넘는 것은 44분째(2×44/1440 = 6.1%), 46분에 6배 단계가 더해진다
  - name: "① 50% 실패가 계속되면 20분 뒤 14.4배 단계가 울린다"
    interval: 1m
    input_series:
      - series: 'traces_span_metrics_calls_total{service_name="checkout", span_name="oteldemo.CheckoutService/PlaceOrder", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_UNSET"}'
        values: '0+4x1440 5762+2x119'
      - series: 'traces_span_metrics_calls_total{service_name="checkout", span_name="oteldemo.CheckoutService/PlaceOrder", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}'
        values: '0x1440 2+2x119'
    alert_rule_test:
      - eval_time: 24h19m       # 아직 pending (1h 창이 임계를 넘은 지 2분이 안 됐다)
        alertname: OrderFailureRateHigh
        exp_alerts: []
      - eval_time: 24h20m       # 14.4배 단계 firing
        alertname: OrderFailureRateHigh
        exp_alerts:
          - exp_labels: {service: checkout, slo: order-availability, burn_rate: "14.4", long_window: 1h, short_window: 5m}
            exp_annotations:
              summary: "주문 오류 예산을 14.4배 넘는 속도로 쓰고 있다 (1h 실패율 16.71%, 임계 14.4%)"
              description: "checkout PlaceOrder 서버 span 의 ERROR 비율이 1h · 5m 창 모두 14.4% 를 넘었다. SLO 는 99%(30일), 기준선은 0% (specs/observability.md 9장 · 10장). 원인 조사는 Claude 에게 /obs-ask 로 묻는다(메트릭 → 트레이스 → 로그)."
              dashboard: "Grafana 대시보드 '결제 여정 (dev)' (uid payment-journey)"
              runbook_url: "https://github.com/TeddySB2/Fastcampus_AIDevOps/blob/part3/docs/runbooks/OrderFailureRateHigh.md"
      - eval_time: 24h46m       # 6배 단계도 firing (2배 단계는 아직: 1d 실패율 1.6%)
        alertname: OrderFailureRateHigh
        exp_alerts:
          - exp_labels: {service: checkout, slo: order-availability, burn_rate: "14.4", long_window: 1h, short_window: 5m}
            exp_annotations:
              summary: "주문 오류 예산을 14.4배 넘는 속도로 쓰고 있다 (1h 실패율 38.58%, 임계 14.4%)"
              description: "checkout PlaceOrder 서버 span 의 ERROR 비율이 1h · 5m 창 모두 14.4% 를 넘었다. SLO 는 99%(30일), 기준선은 0% (specs/observability.md 9장 · 10장). 원인 조사는 Claude 에게 /obs-ask 로 묻는다(메트릭 → 트레이스 → 로그)."
              dashboard: "Grafana 대시보드 '결제 여정 (dev)' (uid payment-journey)"
              runbook_url: "https://github.com/TeddySB2/Fastcampus_AIDevOps/blob/part3/docs/runbooks/OrderFailureRateHigh.md"
          - exp_labels: {service: checkout, slo: order-availability, burn_rate: "6", long_window: 6h, short_window: 30m}
            exp_annotations:
              summary: "주문 오류 예산을 6배 넘는 속도로 쓰고 있다 (6h 실패율 6.39%, 임계 6%)"
              description: "checkout PlaceOrder 서버 span 의 ERROR 비율이 6h · 30m 창 모두 6% 를 넘었다. SLO 는 99%(30일), 기준선은 0% (specs/observability.md 9장 · 10장). 원인 조사는 Claude 에게 /obs-ask 로 묻는다(메트릭 → 트레이스 → 로그)."
              dashboard: "Grafana 대시보드 '결제 여정 (dev)' (uid payment-journey)"
              runbook_url: "https://github.com/TeddySB2/Fastcampus_AIDevOps/blob/part3/docs/runbooks/OrderFailureRateHigh.md"

  # ② 2분만 50% 실패하고 끝난다 → 어느 단계도 울리지 않아야 한다
  #    짧은 창(5m 20% · 30m 3.3%)은 잠깐 넘거나 못 넘지만 긴 창(1h 1.7% · 6h 0.3% · 1d 0.07%)이 임계 아래다
  - name: "② 2분짜리 실패는 울리지 않는다"
    interval: 1m
    input_series:
      - series: 'traces_span_metrics_calls_total{service_name="checkout", span_name="oteldemo.CheckoutService/PlaceOrder", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_UNSET"}'
        values: '0+4x1440 5762 5764 5768+4x60'
      - series: 'traces_span_metrics_calls_total{service_name="checkout", span_name="oteldemo.CheckoutService/PlaceOrder", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}'
        values: '0x1440 2 4x61'
    alert_rule_test:
      - {eval_time: 24h2m, alertname: OrderFailureRateHigh, exp_alerts: []}
      - {eval_time: 24h5m, alertname: OrderFailureRateHigh, exp_alerts: []}
      - {eval_time: 24h30m, alertname: OrderFailureRateHigh, exp_alerts: []}
      - {eval_time: 25h, alertname: OrderFailureRateHigh, exp_alerts: []}

  # ③ 3% 실패가 계속된다 (burn 3배) → 2배 단계가 울린다. 2-3 의 고정 임계(5%)는 이 경우 끝까지 조용했다
  #    분당 성공 97 · 실패 3. 1d 실패율이 2% 를 넘는 것은 장애 16시간째(3×960/144000 ≈ 2%), for: 2m 뒤 16시간 2분에 firing
  #    한계: 느린 누수는 30일 예산의 6.7% 를 쓴 뒤에야 안다. 1시간 뒤에는 아직 조용하다
  - name: "③ 3% 실패가 계속되면 16시간 뒤 2배 단계가 울린다"
    interval: 1m
    input_series:
      - series: 'traces_span_metrics_calls_total{service_name="checkout", span_name="oteldemo.CheckoutService/PlaceOrder", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_UNSET"}'
        values: '0+100x1440 144097+97x1019'
      - series: 'traces_span_metrics_calls_total{service_name="checkout", span_name="oteldemo.CheckoutService/PlaceOrder", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}'
        values: '0x1440 3+3x1019'
    alert_rule_test:
      - {eval_time: 25h, alertname: OrderFailureRateHigh, exp_alerts: []}
      - {eval_time: 40h1m, alertname: OrderFailureRateHigh, exp_alerts: []}
      - eval_time: 40h2m
        alertname: OrderFailureRateHigh
        exp_alerts:
          - exp_labels: {service: checkout, slo: order-availability, burn_rate: "2", long_window: 1d, short_window: 2h}
            exp_annotations:
              summary: "주문 오류 예산을 2배 넘는 속도로 쓰고 있다 (1d 실패율 2.004%, 임계 2%)"
              description: "checkout PlaceOrder 서버 span 의 ERROR 비율이 1d · 2h 창 모두 2% 를 넘었다. 낮은 실패율이 오래 이어지는 느린 누수다. SLO 는 99%(30일), 기준선은 0% (specs/observability.md 9장 · 10장). 원인 조사는 Claude 에게 /obs-ask 로 묻는다(메트릭 → 트레이스 → 로그)."
              dashboard: "Grafana 대시보드 '결제 여정 (dev)' (uid payment-journey)"
              runbook_url: "https://github.com/TeddySB2/Fastcampus_AIDevOps/blob/part3/docs/runbooks/OrderFailureRateHigh.md"

  # ④ 이력이 10분뿐일 때(Prometheus 재시작 직후, emptyDir) 50% 실패 → 세 단계가 7분 안에 모두 울린다 (알려진 한계)
  #    긴 창에 최근 데이터만 있어 1h · 6h · 1d 실패율이 모두 "최근 몇 분의 실패율" 이 된다. ① 의 20분보다 빠르고 2배 단계까지 같이 울린다
  - name: "④ 이력이 없으면 세 단계가 한꺼번에 일찍 울린다 (한계)"
    interval: 1m
    input_series:
      - series: 'traces_span_metrics_calls_total{service_name="checkout", span_name="oteldemo.CheckoutService/PlaceOrder", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_UNSET"}'
        values: '0+4x10 42+2x29'
      - series: 'traces_span_metrics_calls_total{service_name="checkout", span_name="oteldemo.CheckoutService/PlaceOrder", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}'
        values: '0x10 2+2x29'
    alert_rule_test:
      - eval_time: 17m          # 장애 7분째
        alertname: OrderFailureRateHigh
        exp_alerts:
          - exp_labels: {service: checkout, slo: order-availability, burn_rate: "14.4", long_window: 1h, short_window: 5m}
            exp_annotations:
              summary: "주문 오류 예산을 14.4배 넘는 속도로 쓰고 있다 (1h 실패율 20.59%, 임계 14.4%)"
              description: "checkout PlaceOrder 서버 span 의 ERROR 비율이 1h · 5m 창 모두 14.4% 를 넘었다. SLO 는 99%(30일), 기준선은 0% (specs/observability.md 9장 · 10장). 원인 조사는 Claude 에게 /obs-ask 로 묻는다(메트릭 → 트레이스 → 로그)."
              dashboard: "Grafana 대시보드 '결제 여정 (dev)' (uid payment-journey)"
              runbook_url: "https://github.com/TeddySB2/Fastcampus_AIDevOps/blob/part3/docs/runbooks/OrderFailureRateHigh.md"
          - exp_labels: {service: checkout, slo: order-availability, burn_rate: "6", long_window: 6h, short_window: 30m}
            exp_annotations:
              summary: "주문 오류 예산을 6배 넘는 속도로 쓰고 있다 (6h 실패율 20.59%, 임계 6%)"
              description: "checkout PlaceOrder 서버 span 의 ERROR 비율이 6h · 30m 창 모두 6% 를 넘었다. SLO 는 99%(30일), 기준선은 0% (specs/observability.md 9장 · 10장). 원인 조사는 Claude 에게 /obs-ask 로 묻는다(메트릭 → 트레이스 → 로그)."
              dashboard: "Grafana 대시보드 '결제 여정 (dev)' (uid payment-journey)"
              runbook_url: "https://github.com/TeddySB2/Fastcampus_AIDevOps/blob/part3/docs/runbooks/OrderFailureRateHigh.md"
          - exp_labels: {service: checkout, slo: order-availability, burn_rate: "2", long_window: 1d, short_window: 2h}
            exp_annotations:
              summary: "주문 오류 예산을 2배 넘는 속도로 쓰고 있다 (1d 실패율 20.59%, 임계 2%)"
              description: "checkout PlaceOrder 서버 span 의 ERROR 비율이 1d · 2h 창 모두 2% 를 넘었다. 낮은 실패율이 오래 이어지는 느린 누수다. SLO 는 99%(30일), 기준선은 0% (specs/observability.md 9장 · 10장). 원인 조사는 Claude 에게 /obs-ask 로 묻는다(메트릭 → 트레이스 → 로그)."
              dashboard: "Grafana 대시보드 '결제 여정 (dev)' (uid payment-journey)"
              runbook_url: "https://github.com/TeddySB2/Fastcampus_AIDevOps/blob/part3/docs/runbooks/OrderFailureRateHigh.md"
